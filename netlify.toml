[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

[build.environment]
  NODE_VERSION = "22.23.3"

# Prerendered routes are real files. Anything else falls back to the shell
# so the client router can show the not-found page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "private-area"
  path = "/privat"

[[edge_functions]]
  function = "private-area"
  path = "/privat/*"

[[headers]]
  for = "/privat"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/privat/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
