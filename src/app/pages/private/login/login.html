<header class="page-intro">
  <p class="kicker">{{ messages().private.kicker }}</p>
  <h1>{{ messages().private.loginTitle }}</h1>
  <p class="lede">{{ messages().private.loginIntro }}</p>
</header>
<form class="login-form" (submit)="submit($event)">
  <label>
    {{ messages().private.password }}
    <input
      type="password"
      name="password"
      autocomplete="current-password"
      [value]="password()"
      (input)="password.set($any($event.target).value)"
      required
    />
  </label>
  @if (error(); as error) {
    <p class="login-error" role="alert">
      {{ error === 'unavailable' ? messages().private.unavailable : messages().private.wrongPassword }}
    </p>
  }
  <button class="button" type="submit" [disabled]="pending()">
    {{ pending() ? messages().private.pending : messages().private.submit }}
  </button>
</form>
